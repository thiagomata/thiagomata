<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Probability card</title>
    <link rel="stylesheet" href="../../style/style.css" />
    <style>
        /* The "Perceptions of Probability" card with its live chart (js/probability/scene.js): the
           survey's curve morphing from phrase to phrase. Wide, at phone width, and today's static
           card to compare. The card is copied from index.html. */
        body { background: #0b0d10; color: #e9ecef; }
        .lab-intro { max-width: 900px; margin: 24px 16px; font: 16px/1.5 Roboto, sans-serif; }
        .lab-intro h1 { font: bold 32px/1.2 Roboto, sans-serif; margin: 0 0 12px; text-transform: none; }
        .label { font: 20px Roboto, sans-serif; margin: 48px 16px 8px; }
        .narrow { width: 393px; max-width: 100%; }
    </style>
</head>
<body>
    <div class="lab-intro">
        <h1>Probability card: the morphing curve</h1>
        <p>How people read a phrase as a probability, from the project's survey: the curve morphs from
            "Almost No Chance" to "Almost Certainly". <a href="./histogram.html">The histogram version</a>.</p>
    </div>
    <article id="projects"></article>

    <script type="module">
        import { start } from "../../js/probability/scene.js";

        const page = new DOMParser().parseFromString(await (await fetch("../../index.html")).text(), "text/html");
        const template = page.querySelector('#projects [data-project="probability"]');
        const article = document.querySelector("#projects");

        /** A copy of the real card under a label, live unless `still`, optionally at phone width. */
        const showCard = (label, { live = true, narrow = false } = {}) => {
            const heading = document.createElement("div");
            heading.className = "label";
            heading.textContent = label;
            const card = template.cloneNode(true);
            card.querySelectorAll("[id]").forEach(element => element.removeAttribute("id"));
            const holder = document.createElement("div");
            if (narrow) holder.className = "narrow";
            holder.append(card);
            article.append(heading, holder);
            if (live) start(card);
        };
        showCard("Live: the morphing curve");
        showCard("Live, at phone width", { narrow: true });
        showCard("Today: the static picture", { live: false });
    </script>
</body>
</html>
