<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ideia street</title>
    <style>
        /* Ideia background experiment, HTML and CSS only: a street of cube buildings and trees
           seen in 3D. Scrolling drives the camera (a scroll-driven CSS animation) from street
           level up to a rooftop view. */
        :root {
            --ground: #1a1d2b;
            --street: #23263a;
            --sidewalk: #34374a;
            --line: #e6cf86;
            --leaf: #2f6b4f;
            --bark: #4a3426;
        }
        html, body {
            margin: 0;
            background: #0d0f1a;
            color: #cfd3e6;
            font: 14px/1.4 system-ui, sans-serif;
        }
        .track {
            height: 250vh;          /* scroll distance for the whole camera move */
        }
        .viewport {
            position: sticky;
            top: 0;
            height: 100vh;
            overflow: hidden;
            perspective: 1000px;
            perspective-origin: 50% 50%;
            background: linear-gradient(#0d0f1a, #1c2036 60%, #2a2440);
        }
        .hint {
            position: absolute;
            left: 16px;
            bottom: 16px;
            opacity: .6;
        }
        .camera, .world, .cube, .cube i {
            transform-style: preserve-3d;
        }
        .camera {
            position: absolute;
            inset: 0;
            /* Standing in the street (small turn keeps the camera between the buildings); street level by default (and where scroll-driven animations are not supported). */
            transform: translateZ(560px) rotateX(87deg) rotateZ(-8deg);
            animation: fly linear both;
            animation-timeline: scroll(root);
        }
        /* From a person in the street to someone on a rooftop, looking down the same street. */
        @keyframes fly {
            from { transform: translateZ(560px) rotateX(87deg) rotateZ(-8deg); }
            to   { transform: translateY(10vh) translateZ(200px) rotateX(64deg) rotateZ(-8deg); }
        }
        @media (prefers-reduced-motion: reduce) {
            .camera { animation: none; }
        }
        .world {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 2000px;
            height: 6000px;           /* the street runs far ahead of the camera */
            margin: -5000px 0 0 -1000px;
            background:
                linear-gradient(90deg, transparent 880px, var(--sidewalk) 880px 920px, var(--street) 920px 1080px, var(--sidewalk) 1080px 1120px, transparent 1120px),
                var(--ground);
        }
        /* Dashed centre line. */
        .world::after {
            content: "";
            position: absolute;
            left: 997px;
            top: 0;
            width: 6px;
            height: 6000px;
            background: repeating-linear-gradient(var(--line) 0 40px, transparent 40px 90px);
            opacity: .7;
            transform: translateZ(.5px);   /* not on the same plane as the road */
        }

        /* A cube sits on the ground at (--x, --y), --w wide, --d deep and --h tall, lifted by --z.
           Its faces are the top and the four walls; walls stand up by rotating around an edge. */
        .cube {
            position: absolute;
            left: var(--x);
            top: var(--y);
            width: var(--w);
            height: var(--d);
            /* 1px above the ground: walls that start exactly on the ground plane flicker. */
            transform: translateZ(calc(var(--z) + 1px));
        }
        .cube i {
            position: absolute;
            background: var(--c);
        }
        .cube .top {
            inset: 0;
            transform: translateZ(var(--h));
            background: color-mix(in srgb, var(--c), white 18%);
        }
        .cube .north, .cube .south {
            left: 0;
            width: var(--w);
            height: var(--h);
            transform-origin: top;
            transform: rotateX(90deg);
        }
        .cube .north { top: 0; background-color: color-mix(in srgb, var(--c), black 35%); }
        .cube .south { top: var(--d); }
        .cube .west, .cube .east {
            top: 0;
            width: var(--h);
            height: var(--d);
            transform-origin: left;
            transform: rotateY(-90deg);
        }
        .cube .west { left: 0; background-color: color-mix(in srgb, var(--c), black 15%); }
        .cube .east { left: var(--w); background-color: color-mix(in srgb, var(--c), black 50%); }

        /* Lit windows on building walls: floor bands drawn over window columns. */
        .building i:not(.top) {
            background-image:
                repeating-linear-gradient(90deg, color-mix(in srgb, var(--c), black 30%) 0 12px, transparent 12px 26px),
                repeating-linear-gradient(0deg, transparent 0 10px, rgba(255, 205, 120, .55) 10px 22px, transparent 22px 30px);
        }
        .building .north, .building .south {
            background-image:
                repeating-linear-gradient(0deg, color-mix(in srgb, var(--c), black 30%) 0 12px, transparent 12px 26px),
                repeating-linear-gradient(90deg, transparent 0 10px, rgba(255, 205, 120, .55) 10px 22px, transparent 22px 30px);
        }
        .trunk { --c: var(--bark); }
        .canopy { --c: var(--leaf); }
    </style>
</head>
