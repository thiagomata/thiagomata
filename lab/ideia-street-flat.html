<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ideia street (flat)</title>
    <style>
        /* Flat, illustrated look of ideia-street-three.html: two-tone (toon) shading, dark
           outlines and the colours of the site's illustrations, so the scene reads like the
           vector art elsewhere on the page. Same street, buildings, trees and
           buildings and trees, seen from a fixed rooftop view, with fog in the distance and a
           crowd of illustrated sprites walking on the sidewalks and over the zebra crossings. */
        html, body {
            margin: 0;
            background: #0d0f1a;
            color: #cfd3e6;
            font: 14px/1.4 system-ui, sans-serif;
        }
        .viewport {
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.min.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div class="viewport">
        <canvas id="scene" aria-hidden="true"></canvas>
    </div>
    <script type="module">
        import * as THREE from "three";
        import { mergeGeometries } from "three/addons/utils/BufferGeometryUtils.js";

        // Same layout as ideia-street.html, in the same units (1 unit = 1 CSS px there).
        // The street runs along -Z; the origin is the point the camera looks at.
        const LENGTH = 6000;            // street length
        const AHEAD = 5000;             // how much of it is in front of the origin
        const SKY = 0x192840;
        const INK = 0x0b1c26;          // outline colour, the darkest navy of the illustrations

        // Camera: fixed, as if from a rooftop, looking down the street (eye about 350 units up).
        // Only the people move.
        const VIEW = { pitch: -26, distance: 800 };
        const YAW = 4;                                  // degrees off the street axis (keeps the camera over the road)

        const canvas = document.getElementById("scene");
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(SKY);
        scene.fog = new THREE.Fog(SKY, 1200, 5200);
        const camera = new THREE.PerspectiveCamera(44, 1, 1, 9000);

        scene.add(new THREE.HemisphereLight(0xc9d4ff, 0x29201b, 1.4));
        const moon = new THREE.DirectionalLight(0xffffff, 1.6);
        moon.position.set(-0.6, 1, 0.35);
        scene.add(moon);

        // Toon shading: light falls into three flat tones instead of a smooth gradient.
        const steps = new THREE.DataTexture(new Uint8Array([90, 170, 255]), 3, 1, THREE.RedFormat);
        steps.minFilter = steps.magFilter = THREE.NearestFilter;
        steps.needsUpdate = true;
        const toon = (params = {}) => new THREE.MeshToonMaterial({ gradientMap: steps, ...params });
        // Outline: a slightly bigger copy drawn inside out in ink, sharing the instance transforms.
        const ink = new THREE.MeshBasicMaterial({ color: INK, side: THREE.BackSide });
        const outline = (mesh, grow) => {
            const hull = new THREE.InstancedMesh(mesh.geometry.clone().scale(grow, grow, grow), ink, mesh.count);
            hull.instanceMatrix = mesh.instanceMatrix;
            hull.frustumCulled = false;
            scene.add(hull);
        };

        // Seeded random numbers, so the city is the same on every load.
        let seed = 7;
        const random = () => {
            seed = (seed + 0x6D2B79F5) | 0;
            let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
        const between = (a, b) => a + Math.floor(random() * (b - a + 1));
        const choose = list => list[Math.floor(random() * list.length)];
        const toX = x => x - 1000, toZ = y => y - AHEAD;

        // Windows: one tile with a random mix of lit and dark windows, repeated over every wall.
        // The colour map is the wall (tinted per building); the emissive map makes windows glow.
        const tile = (draw) => {
            const c = document.createElement("canvas");
            c.width = c.height = 256;
            draw(c.getContext("2d"));
            const texture = new THREE.CanvasTexture(c);
            texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
            texture.colorSpace = THREE.SRGBColorSpace;
            texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
            return texture;
        };
        const CELL = 32, lit = [];
        for (let i = 0; i < 64; i++) lit.push(random() < 0.62);
        const windows = (ctx, on, off) => {
            for (let i = 0; i < 64; i++) {
                ctx.fillStyle = lit[i] ? on : off;
                ctx.fillRect((i % 8) * CELL + 9, Math.floor(i / 8) * CELL + 8, 14, 16);
            }
        };
        const wallMap = tile(ctx => { ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, 256, 256); windows(ctx, "#fff", "#555"); });
        const glowMap = tile(ctx => { ctx.fillStyle = "#000"; ctx.fillRect(0, 0, 256, 256); windows(ctx, "#F6BF78", "#000"); });

        // A box whose wall UVs are in world units / 256, so windows keep the same size on every
        // building; the roof samples a window-free corner of the tile.
        const box = (w, h, d, colour) => {
            const g = new THREE.BoxGeometry(w, h, d);
            const uv = g.attributes.uv;
            const faces = [[d, h], [d, h], null, null, [w, h], [w, h]];   // +x, -x, +y, -y, +z, -z
            faces.forEach((size, face) => {
                for (let v = face * 4; v < face * 4 + 4; v++) {
                    if (size) uv.setXY(v, uv.getX(v) * size[0] / 256, uv.getY(v) * size[1] / 256);
                    else uv.setXY(v, 0.01, 0.01);
                }
            });
            const c = new THREE.Color(colour), colours = [];
            for (let i = 0; i < g.attributes.position.count; i++) colours.push(c.r, c.g, c.b);
            g.setAttribute("color", new THREE.Float32BufferAttribute(colours, 3));
            return g;
        };

        // Brick, sandstone, slate, ochre, painted plaster and concrete, as seen at night.
        const palette = ["#7FAFBB", "#819FAC", "#687FA2", "#B48778", "#AA8B7D", "#B07461",
                         "#925854", "#635E5E", "#43474E", "#354146", "#737373", "#9A8F86"];
        const buildings = [];
        const building = (x, y, w, d, h) => {
            // A small, deterministic change in lightness so neighbours of the same colour differ.
            const shade = ((buildings.length * 97) % 21 - 10) / 100;
            const g = box(w, h, d, new THREE.Color(choose(palette)).offsetHSL(0, 0, shade));
            g.translate(toX(x + w / 2), h / 2, toZ(y + d / 2));
            buildings.push(g);
        };
        for (const [side, x0, x1] of [["left", 620, 880], ["right", 1120, 1380]]) {
            for (let y = 40; y < LENGTH - 100;) {
                const d = between(110, 210), w = between(170, 260), h = choose([90, 140, 180, 220, 260, 320, 400]);
                building(side === "left" ? x1 - w : x0, y, w, d, h);
                y += d + between(14, 40);
            }
            for (let y = 80; y < LENGTH - 100;) {
                const d = between(150, 260), w = between(180, 300), h = choose([200, 280, 360, 460]);
                building(side === "left" ? x0 - w - 30 : x1 + 30, y, w, d, h);
                y += d + between(20, 60);
            }
        }
        const city = mergeGeometries(buildings);
        scene.add(new THREE.Mesh(city, toon({
            map: wallMap, vertexColors: true, emissiveMap: glowMap, emissive: 0xffffff,
        })));
        scene.add(new THREE.LineSegments(new THREE.EdgesGeometry(city, 30), new THREE.LineBasicMaterial({ color: INK })));

        // Ground, sidewalks, road and the dashed centre line.
        const flat = (w, d, colour, x, z, y) => {
            const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, d), toon({ color: colour }));
            mesh.rotation.x = -Math.PI / 2;
            mesh.position.set(x, y, z);
            scene.add(mesh);
            return mesh;
        };
        // Layout across the street (x): buildings end at 880 and start at 1120; the sidewalks
        // are 70 wide and the road between them 100 (two lanes).
        const ROAD = [950, 1050], WALKS = [[880, 950], [1050, 1120]];
        const middle = toZ(LENGTH / 2);
        flat(4000, LENGTH + 4000, "#29201B", 0, middle, 0);
        flat(240, LENGTH, "#635E5E", 0, middle, 0.3);
        flat(ROAD[1] - ROAD[0], LENGTH, "#2D2D2D", 0, middle, 0.6);
        const place = new THREE.Object3D();
        const stripes = (count, w, d, colour, at) => {
            const mesh = new THREE.InstancedMesh(new THREE.PlaneGeometry(w, d), new THREE.MeshBasicMaterial({ color: colour }), count);
            for (let i = 0; i < count; i++) {
                place.rotation.set(-Math.PI / 2, 0, 0);
                place.position.set(...at(i));
                place.updateMatrix();
                mesh.setMatrixAt(i, place.matrix);
            }
            scene.add(mesh);
        };
        stripes(Math.ceil(LENGTH / 90), 4, 40, "#BBBD41", i => [0, 0.9, toZ(i * 90 + 20)]);

        // Zebra crossings every 600 units: bars along the street, side by side across the road.
        const CROSSINGS = [];
        for (let y = 300; y < LENGTH - 200; y += 600) CROSSINGS.push(y);
        const BARS = 6;
        stripes(CROSSINGS.length * BARS, 9, 44, "#D9D9D9", i => {
            const y = CROSSINGS[Math.floor(i / BARS)], bar = i % BARS;
            return [toX(ROAD[0] + 6 + bar * 16.5 + 4.5), 1.0, toZ(y)];
        });

        // Trees on both sidewalks, next to the kerb, skipping the crossings.
        const spots = [];
        for (const x of [940, 1060]) for (let y = 90; y < LENGTH - 100; y += 170) {
            if (!CROSSINGS.some(c => Math.abs(c - y) < 40)) spots.push([toX(x), toZ(y)]);
        }
        // Each tree is a trunk with a canopy of overlapping spheres, in the greens and browns of
        // img/people-night.svg.
        const leaves = ["#B6CB70", "#A9C063", "#97AD53", "#85AC51", "#6B9C4B", "#648535", "#507436", "#486C30", "#38552E"];
        const PUFFS = 6;
        const trunks = new THREE.InstancedMesh(new THREE.CylinderGeometry(2.5, 3.5, 42, 8), toon({ color: "#604031" }), spots.length);
        const canopies = new THREE.InstancedMesh(new THREE.SphereGeometry(1, 14, 10), toon(), spots.length * PUFFS);
        spots.forEach(([x, z], i) => {
            place.rotation.set(0, 0, 0);
            place.scale.setScalar(1);
            place.position.set(x, 21, z); place.updateMatrix(); trunks.setMatrixAt(i, place.matrix);
            // Darker greens at the bottom of the canopy, lighter ones on top where the light lands.
            for (let k = 0; k < PUFFS; k++) {
                const up = k / (PUFFS - 1);
                const radius = 15 - up * 5 + random() * 4;
                const angle = random() * Math.PI * 2, spread = (1 - up) * 10;
                place.scale.setScalar(radius);
                place.position.set(x + Math.cos(angle) * spread, 46 + up * 22, z + Math.sin(angle) * spread);
                place.updateMatrix();
                canopies.setMatrixAt(i * PUFFS + k, place.matrix);
                const shade = Math.min(leaves.length - 1, Math.floor((1 - up) * (leaves.length - 1) * 0.8 + random() * 3));
                canopies.setColorAt(i * PUFFS + k, new THREE.Color(leaves[shade]));
            }
        });
        place.scale.setScalar(1);
        scene.add(trunks, canopies);
        outline(trunks, 1.25);
        outline(canopies, 1.07);

        // Cars: a body, a glass cabin with a roof, four wheels, and head and tail lights.
        // Painted parts are one lit mesh per car; the lights are unlit so they glow.
        const paint = (geometry, colour, x, y, z) => {
            const c = new THREE.Color(colour), colours = [];
            for (let i = 0; i < geometry.attributes.position.count; i++) colours.push(c.r, c.g, c.b);
            geometry.setAttribute("color", new THREE.Float32BufferAttribute(colours, 3));
            geometry.deleteAttribute("uv");
            return geometry.translate(x, y, z);
        };
        const wheel = (x, z) => paint(new THREE.CylinderGeometry(4.5, 4.5, 3, 14).rotateZ(Math.PI / 2), "#15161a", x, 4.5, z);
        const car = (colour, facing) => {
            // Built facing -z (front at z = -28), then turned to face the lane's direction.
            const body = mergeGeometries([
                paint(new THREE.BoxGeometry(30, 9, 56), colour, 0, 8, 0),
                paint(new THREE.BoxGeometry(26, 8, 28), "#2a3550", 0, 16.5, 4),        // windows
                paint(new THREE.BoxGeometry(27, 1.6, 26), colour, 0, 21.2, 4),        // roof
                wheel(-14.5, -17), wheel(14.5, -17), wheel(-14.5, 18), wheel(14.5, 18),
            ]);
            const lights = mergeGeometries([
                paint(new THREE.BoxGeometry(6, 3, 1), "#fff3c4", -9, 9, -28.2),
                paint(new THREE.BoxGeometry(6, 3, 1), "#fff3c4", 9, 9, -28.2),
                paint(new THREE.BoxGeometry(6, 3, 1), "#ff2e2e", -9, 9, 28.2),
                paint(new THREE.BoxGeometry(6, 3, 1), "#ff2e2e", 9, 9, 28.2),
            ]);
            const group = new THREE.Group();
            group.add(new THREE.Mesh(body, toon({ vertexColors: true })));
            group.add(new THREE.Mesh(lights, new THREE.MeshBasicMaterial({ vertexColors: true })));
            group.add(new THREE.LineSegments(new THREE.EdgesGeometry(body, 30), new THREE.LineBasicMaterial({ color: INK })));
            group.rotation.y = facing;
            return group;
        };
        // One per lane: the left lane drives away from the camera, the right lane towards it.
        for (const [x, y, colour] of [[960, LENGTH - 1580, "#c4483e"], [1010, LENGTH - 1020, "#d9b44a"], [960, LENGTH - 2600, "#4f8fc4"], [1010, LENGTH - 3700, "#c4483e"], [960, LENGTH - 4800, "#d9b44a"]]) {
            const vehicle = car(colour, x < 1000 ? 0 : Math.PI);
            vehicle.position.set(toX(x + 15), 0, toZ(y + 28));
            scene.add(vehicle);
        }

        // The camera is fixed: it sits VIEW.distance from the origin, looking at it with VIEW.pitch.
        const pitch = THREE.MathUtils.degToRad(VIEW.pitch), yaw = THREE.MathUtils.degToRad(YAW);
        camera.position.set(
            Math.sin(yaw) * Math.cos(pitch) * VIEW.distance,
            -Math.sin(pitch) * VIEW.distance,
            Math.cos(yaw) * Math.cos(pitch) * VIEW.distance,
        );
        camera.lookAt(0, 0, 0);

        // The crowd: flat illustrated figures (sprites) that always face the camera, about 26
        // units tall next to the 22-unit cars. Walkers go up and down the sidewalks; crossers go
        // back and forth over a zebra crossing.
        const WALKERS = 1400, CROSSERS = 160;
        const people = [];
        for (let i = 0; i < WALKERS; i++) {
            const [x0, x1] = WALKS[i % 2];
            people.push({
                kind: "walk",
                x: toX(between(x0 + 6, x1 - 6)),
                z: toZ(random() * LENGTH),
                speed: (random() < 0.5 ? -1 : 1) * (14 + random() * 14),   // units per second
                phase: random() * 4,
            });
        }
        for (let i = 0; i < CROSSERS; i++) {
            people.push({
                kind: "cross",
                z: toZ(choose(CROSSINGS) + between(-16, 16)),
                from: toX(WALKS[0][1] - 10), to: toX(WALKS[1][0] + 10),
                speed: 12 + random() * 10,
                offset: random(),
                phase: random() * 4,
            });
        }

        // Sprite sheet: 32 looks (shirt, trousers, skin, hair) x 3 views (front, back, side) x 4
        // walking frames, drawn like the site's vector illustrations: flat fills with an ink outline.
        const LOOKS = 32, VIEWS = 3, FRAMES = 4, CELL_W = 48, CELL_H = 96, SHEET_COLS = 16;
        const SHEET_ROWS = LOOKS * VIEWS * FRAMES / SHEET_COLS;
        const FRONT = 0, BACK = 1, SIDE = 2;
        const shirts = ["#B07461", "#7FAFBB", "#BBBD41", "#687FA2", "#D9D9D9", "#925854", "#F6BF78", "#511201", "#97AD53", "#43474E"];
        const trousers = ["#192840", "#28393B", "#363636", "#635E5E", "#29201B", "#354146"];
        const skins = ["#F1C9A5", "#D9A37C", "#B48778", "#A8714F", "#6E4A33"];
        const hairColours = ["#1B1512", "#29201B", "#4A2E21", "#7A5232", "#B48A52", "#D8C08A", "#8C8C8C", "#511201"];
        const sheet = document.createElement("canvas");
        sheet.width = SHEET_COLS * CELL_W;
        sheet.height = SHEET_ROWS * CELL_H;
        const ctx = sheet.getContext("2d");
        ctx.lineWidth = 2.5;
        ctx.lineCap = ctx.lineJoin = "round";
        ctx.strokeStyle = "#0B1C26";
        const limb = (x0, y0, x1, y1, colour, width) => {
            ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1);
            ctx.lineWidth = width + 2.5; ctx.strokeStyle = "#0B1C26"; ctx.stroke();
            ctx.lineWidth = width; ctx.strokeStyle = colour; ctx.stroke();
            ctx.lineWidth = 2.5; ctx.strokeStyle = "#0B1C26";
        };
        for (let look = 0; look < LOOKS; look++) {
            const shirt = choose(shirts), legs = choose(trousers), skin = choose(skins), hair = choose(hairColours);
            const long = random() < 0.4;               // longer hair down the back of the head
            for (let view = 0; view < VIEWS; view++) for (let f = 0; f < FRAMES; f++) {
                const cell = (look * VIEWS + view) * FRAMES + f;
                ctx.save();
                ctx.translate((cell % SHEET_COLS) * CELL_W, Math.floor(cell / SHEET_COLS) * CELL_H);
                const swing = [-1, 0, 1, 0][f] * 7;    // legs and arms swing opposite each other
                if (view === SIDE) {
                    // Profile facing right: legs and the near arm swing forwards and back.
                    limb(24, 60, 24 + swing, 90, legs, 6);
                    limb(24, 60, 24 - swing, 90, legs, 6);
                    ctx.fillStyle = shirt;
                    ctx.beginPath(); ctx.roundRect(17, 30, 15, 33, 6); ctx.fill(); ctx.stroke();
                    limb(24, 36, 24 - swing * 0.8, 58, skin, 4);
                    if (long) { ctx.fillStyle = hair; ctx.beginPath(); ctx.roundRect(13, 12, 14, 22, 6); ctx.fill(); ctx.stroke(); }
                    ctx.fillStyle = skin;
                    ctx.beginPath(); ctx.arc(25, 19, 9, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                    // Hair over the top and the back of the head.
                    ctx.fillStyle = hair;
                    ctx.beginPath(); ctx.arc(25, 18, 9.5, Math.PI * 0.6, Math.PI * 1.85); ctx.closePath(); ctx.fill(); ctx.stroke();
                } else {
                    limb(20, 60, 20 + swing, 90, legs, 6);
                    limb(28, 60, 28 - swing, 90, legs, 6);
                    limb(14, 36, 12 - swing * 0.6, 58, skin, 4);
                    limb(34, 36, 36 + swing * 0.6, 58, skin, 4);
                    ctx.fillStyle = shirt;
                    ctx.beginPath(); ctx.roundRect(13, 30, 22, 33, 6); ctx.fill(); ctx.stroke();
                    if (view === BACK) {
                        // From behind the head is all hair, and long hair falls over the shoulders.
                        ctx.fillStyle = hair;
                        if (long) { ctx.beginPath(); ctx.roundRect(14, 14, 20, 24, 7); ctx.fill(); ctx.stroke(); }
                        ctx.beginPath(); ctx.arc(24, 19, 9.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                    } else {
                        if (long) { ctx.fillStyle = hair; ctx.beginPath(); ctx.roundRect(14, 12, 20, 22, 7); ctx.fill(); ctx.stroke(); }
                        ctx.fillStyle = skin;
                        ctx.beginPath(); ctx.arc(24, 19, 9, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                        ctx.fillStyle = hair;
                        ctx.beginPath(); ctx.arc(24, 18, 9.5, Math.PI * 1.05, Math.PI * 1.95); ctx.closePath(); ctx.fill(); ctx.stroke();
                    }
                }
                ctx.restore();
            }
        }
        const sprites = new THREE.CanvasTexture(sheet);
        sprites.colorSpace = THREE.SRGBColorSpace;
        sprites.anisotropy = renderer.capabilities.getMaxAnisotropy();

        // One instanced quad per person; aCell picks the sprite-sheet cell for each instance.
        const figure = new THREE.PlaneGeometry(13, 26).translate(0, 13, 0);
        const cells = new THREE.InstancedBufferAttribute(new Float32Array(people.length), 1);
        cells.setUsage(THREE.DynamicDrawUsage);
        figure.setAttribute("aCell", cells);
        const crowdMaterial = new THREE.MeshBasicMaterial({ map: sprites, alphaTest: 0.5, side: THREE.DoubleSide });
        crowdMaterial.onBeforeCompile = shader => {
            shader.vertexShader = shader.vertexShader
                .replace("#include <common>", "#include <common>\nattribute float aCell;")
                .replace("#include <uv_vertex>", `#include <uv_vertex>
                    vMapUv = (vec2(mod(aCell, ${SHEET_COLS}.0), ${SHEET_ROWS - 1}.0 - floor(aCell / ${SHEET_COLS}.0)) + uv) / vec2(${SHEET_COLS}.0, ${SHEET_ROWS}.0);`);
        };
        const crowd = new THREE.InstancedMesh(figure, crowdMaterial, people.length);
        crowd.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
        crowd.frustumCulled = false;
        scene.add(crowd);
        people.forEach(p => {
            // Height: mostly adults from short to tall, and some children.
            p.height = random() < 0.08 ? 0.6 + random() * 0.15 : 0.82 + random() * 0.34;
            p.build = 0.9 + random() * 0.2;
            p.look = Math.floor(random() * LOOKS);
        });

        const walk = seconds => {
            const span = LENGTH;
            people.forEach((p, i) => {
                let x, z, view, mirror = 1;
                if (p.kind === "walk") {
                    // The camera is at +z: people walking towards it show their front.
                    view = p.speed > 0 ? FRONT : BACK;
                    // Wrap around the street so the sidewalks never empty.
                    const travelled = ((p.z - toZ(0) + p.speed * seconds) % span + span) % span;
                    x = p.x;
                    z = toZ(0) + travelled;
                } else {
                    // Ping-pong across the road, seen from the side, facing the way they walk.
                    const width = p.to - p.from;
                    const t = (p.offset + p.speed * seconds / width) % 2;
                    x = p.from + width * (t < 1 ? t : 2 - t);
                    z = p.z;
                    view = SIDE;
                    if (t >= 1) mirror = -1;
                }
                // Stand up straight, turned towards the camera.
                place.quaternion.copy(camera.quaternion);
                place.position.set(x, 0, z);
                place.scale.set(p.build * p.height * mirror, p.height, 1);
                place.updateMatrix();
                crowd.setMatrixAt(i, place.matrix);
                cells.array[i] = (p.look * VIEWS + view) * FRAMES + Math.floor(seconds * 8 + p.phase) % FRAMES;
            });
            crowd.instanceMatrix.needsUpdate = true;
            cells.needsUpdate = true;
        };

        const still = window.matchMedia("(prefers-reduced-motion: reduce)");
        const render = time => {
            walk(still.matches ? 0 : time / 1000);
            renderer.render(scene, camera);
        };

        // People keep walking, so draw every frame; with reduced motion, draw once (and on
        // resize) with everyone standing still.
        let frame = null;
        const loop = time => { render(time); frame = still.matches ? null : requestAnimationFrame(loop); };
        const request = () => { if (frame === null) frame = requestAnimationFrame(loop); };
        const resize = () => {
            const { clientWidth: w, clientHeight: h } = canvas;
            renderer.setSize(w, h, false);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            request();
        };
        window.addEventListener("resize", resize);
        still.addEventListener("change", request);
        resize();
    </script>
</body>
</html>
