<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Windmills and grass</title>
    <style>
        /* The Elegant card's windmills with wind, in depth layers: the field (sky, ground, road,
           bushes), the grass behind the windmills, the windmills' bodies, the sails turning in
           three.js, and the grass in front, all bent by the same wind that drives the sails
           (js/windmills/scene.js, grass.js, wind.js). */
        html, body {
            margin: 0;
            background: #0d0f1a;
        }
        .picture {
            position: relative;
            width: 100%;
            aspect-ratio: 4294 / 2474;     /* the picture's viewBox */
            background: url("../img/simple2-field.svg") center / 100% 100% no-repeat;
        }
        .windmill-sails,
        .windmill-grass,
        .windmill-bodies {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.min.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div class="picture"></div>
    <script type="module">
        import { start } from "../js/windmills/scene.js";
        start(document.querySelector(".picture"), { grass: "layered", windmillsImage: "../img/simple2-windmills.svg" });
    </script>
</body>
</html>
