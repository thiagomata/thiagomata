<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Parallax hero card</title>
    <link rel="stylesheet" href="../../style/style.css" />
    <style>
        /* The Parallax card with the Parallax Engine's hero scene (scene.js: a cartoon village in
           painted layers) instead of today's tunnel, wide and at phone width, with today's card to
           compare. Scroll to move the eye. The card is copied from index.html. */
        body { background: #0b0d10; color: #e9ecef; }
        .lab-intro { max-width: 900px; margin: 24px 16px; font: 16px/1.5 Roboto, sans-serif; }
        .lab-intro h1 { font: bold 32px/1.2 Roboto, sans-serif; margin: 0 0 12px; text-transform: none; }
        .lab-intro img { width: 300px; margin-right: 12px; vertical-align: top; }
        .label { font: 20px Roboto, sans-serif; margin: 48px 16px 8px; }
        .narrow { width: 393px; max-width: 100%; }
        #projects [data-project="parallax"] .parallax-hero {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        .spacer { height: 60vh; }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.min.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div class="lab-intro">
        <h1>Parallax card: the hero village</h1>
        <p>The village's 14 painted layers as WebP at 60% of their size: 164 KB in all (1.6 MB as the
            original PNGs). Scroll past the cards to see the layers move.</p>
        <p>The still shown before the scene loads, as JPG (33 KB) and WebP (24 KB):<br>
            <img src="./img/still.jpg" alt="The still, as JPG" /><img src="./img/still.webp" alt="The still, as WebP" /></p>
    </div>
    <div class="spacer"></div>
    <article id="projects"></article>
    <div class="spacer"></div>

    <script type="module">
        import { start as startHero } from "./scene.js";
        import { start as startTunnel } from "../../js/parallax/scene.js";

        const page = new DOMParser().parseFromString(await (await fetch("../../index.html")).text(), "text/html");
        const template = page.querySelector('#projects [data-project="parallax"]');
        const article = document.querySelector("#projects");

        /** A copy of the real card, live with `start`, under a label, optionally at phone width. */
        const showCard = (label, start, narrow = false) => {
            const heading = document.createElement("div");
            heading.className = "label";
            heading.textContent = label;
            const card = template.cloneNode(true);
            card.querySelectorAll("[id]").forEach(element => element.removeAttribute("id"));
            const holder = document.createElement("div");
            if (narrow) holder.className = "narrow";
            holder.append(card);
            article.append(heading, holder);
            start(card);
            card.classList.add("parallax-live");
        };
        showCard("The hero village", startHero);
        showCard("The hero village, at phone width", startHero, true);
        showCard("Today: the tunnel", startTunnel);
    </script>
</body>
</html>
