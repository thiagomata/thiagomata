<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WAP Phone - thiagomata.com edition</title>
<style>
  :root {
    --lcd: #9cb23a;
    --lcd-dark: #7e922e;
    --pixel: #1c2410;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    padding: 12px 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, #2a2d33, #15171b);
    font-family: "Courier New", monospace;
  }
  .phone {
    background: linear-gradient(100deg, #2b2f36 0%, #474c55 45%, #2b2f36 100%);
    border-radius: 60px 60px 46px 46px / 40px 40px 34px 34px;
    padding: 18px 18px 0;
    box-shadow: 0 24px 60px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.12),
                inset 0 -2px 6px rgba(0,0,0,.5);
  }
  .earpiece {
    width: 64px; height: 7px;
    margin: 0 auto 14px;
    border-radius: 4px;
    background: repeating-linear-gradient(90deg, #111 0 4px, #2a2d33 4px 7px);
    box-shadow: inset 0 1px 2px rgba(0,0,0,.8);
  }
  .screen-frame {
    background: #0e0f10;
    border-radius: 8px;
    padding: 10px;
    box-shadow: inset 0 2px 8px rgba(0,0,0,.9);
  }
  .screen {
    width: 300px;
    height: 340px;
    background: var(--lcd);
    border-radius: 3px;
    box-shadow: inset 0 0 22px rgba(0,0,0,.25);
    color: var(--pixel);
    /* LCD pixels were chunky: one or two dots per stroke, never hairlines */
    font-weight: bold;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }
  /* Backlight timeout: with the green LEDs off the panel is a dull
     reflective grey-green; any key press lights it again. */
  .screen, .cardtitle { transition: background-color .6s, color .6s; }
  .screen.unlit { --lcd: #8e9a82; box-shadow: inset 0 0 30px rgba(0,0,0,.35); }
  /* faint LCD pixel grid */
  .screen::after {
    content: "";
    position: absolute; inset: 0;
    background-image:
      repeating-linear-gradient(0deg, rgba(0,0,0,.06) 0 1px, transparent 1px 2px),
      repeating-linear-gradient(90deg, rgba(0,0,0,.06) 0 1px, transparent 1px 2px);
    pointer-events: none;
  }
  .statusbar {
    font-size: 10px;
    padding: 3px 8px;
    display: flex;
    justify-content: space-between;
    border-bottom: 1px solid rgba(28,36,16,.35);
    flex-shrink: 0;
  }
  .cardtitle {
    background: var(--pixel);
    color: var(--lcd);
    font-size: 11px;
    padding: 3px 8px;
    flex-shrink: 0;
    white-space: nowrap;
    overflow: hidden;
  }
  .content {
    flex: 1;
    overflow: auto;
    padding: 8px 10px;
    font-size: 13px;
    line-height: 1.5;
    scrollbar-width: none;
  }
  .content::-webkit-scrollbar { display: none; }
  .content a {
    color: var(--pixel);
    text-decoration: underline;
    cursor: pointer;
    display: inline;
  }
  .softkeys {
    display: flex;
    justify-content: space-between;
    flex-shrink: 0;
    padding: 4px 8px 2px;
    font-size: 11px;
    border-top: 1px solid rgba(28,36,16,.35);
  }
  .sk {
    background: none; border: 0; padding: 0;
    font: inherit; color: inherit;
    cursor: pointer;
    text-decoration: underline;
    user-select: none;
  }
  .sk.dim { visibility: hidden; }
  /* Navi roller between two soft keys, as on the 7110 */
  .navi {
    display: grid;
    grid-template-columns: 1fr 74px 1fr;
    align-items: center;
    gap: 10px;
    margin-top: 14px;
  }
  .key {
    background: linear-gradient(180deg, #5a5f68, #33363c);
    border: none;
    color: #e2e4e8;
    font-family: Arial, sans-serif;
    font-size: 12px;
    cursor: pointer;
    box-shadow: 0 3px 0 #111215, inset 0 1px 0 rgba(255,255,255,.15);
    user-select: none;
  }
  .key:active { transform: translateY(2px); box-shadow: 0 1px 0 #111215; }
  .softkey { height: 26px; border-radius: 13px 13px 13px 13px / 13px 13px 13px 13px; }
  .softkey::after {
    content: ""; display: block; width: 26px; height: 3px; margin: 0 auto;
    border-radius: 2px; background: #c9ccd2;
  }
  .roller {
    height: 46px;
    border-radius: 12px;
    cursor: ns-resize;
    background:
      linear-gradient(180deg, rgba(0,0,0,.55), transparent 30%, transparent 70%, rgba(0,0,0,.55)),
      repeating-linear-gradient(180deg, #8a8f98 0 2px, #4b4f56 2px 5px);
    background-position: 0 0, 0 var(--roll, 0px);
    box-shadow: inset 0 0 0 2px #1a1c20, 0 2px 0 #111215;
  }
  .callkeys {
    display: flex;
    justify-content: space-between;
    margin: 12px 4px 0;
  }
  .call { width: 64px; height: 24px; border-radius: 12px; font-size: 15px; line-height: 24px; }
  .call.green { color: #6fd36f; }
  .call.red { color: #ef6a5c; }
  /* 12-key pad, with the slide cover pulled down below it */
  .keypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px 14px;
    padding: 14px 14px 4px;
  }
  .num {
    -webkit-touch-callout: none;
    touch-action: manipulation;
    height: 30px;
    border-radius: 15px;
    font-size: 15px;
    line-height: 1;
  }
  .num small { display: block; font-size: 7px; letter-spacing: 1px; color: #a9adb5; }
  .cover {
    margin: 14px -18px 0;
    height: 64px;
    border-radius: 0 0 46px 46px / 0 0 34px 34px;
    background: linear-gradient(100deg, #23262c 0%, #3c4048 45%, #23262c 100%);
    border-top: 2px solid #15171a;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cover::before {
    content: ""; width: 70px; height: 8px;
    background: repeating-linear-gradient(90deg, #111 0 2px, transparent 2px 5px);
    border-radius: 2px;
  }
  /* Dialled number, typed over the bottom of the card */
  .dialer {
    position: absolute; left: 0; right: 0; bottom: 22px;
    padding: 2px 10px;
    background: var(--lcd);
    border-top: 1px solid rgba(28,36,16,.35);
    font-size: 26px;
    text-align: right;
    letter-spacing: 2px;
    z-index: 2;
  }
  .dialer.long { font-size: 18px; letter-spacing: 1px; padding-top: 8px; }
  /* Call screen: covers the card during a call */
  .call-screen {
    position: absolute; left: 0; right: 0; top: 19px; bottom: 22px;
    padding: 14px 12px;
    background: var(--lcd);
    font-size: 15px;
    line-height: 1.5;
    white-space: pre-wrap;
    overflow-y: auto;
    scrollbar-width: none;
    z-index: 3;
  }
  .call-screen.dark { background: var(--pixel); color: var(--lcd); }
  .call-screen.term { font-size: 12px; line-height: 1.4; padding: 8px; }
  .call-screen .cursor { animation: blink 1s steps(1) infinite; }
  .call-screen canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .call-screen a { color: inherit; cursor: pointer; text-decoration: underline; }
  .meter i { font-style: normal; }
  .meter i.off { opacity: .2; }
  .screen.flash { filter: invert(1); }
  #signal.blink { animation: blink .15s steps(1) 4; }
  @keyframes blink { 50% { visibility: hidden; } }
  .caption {
    color: #a3a7ae;
    font-family: Arial, sans-serif;
    font-size: 12px;
    line-height: 1.5;
    margin: 0 16px 14px;
    text-align: center;
  }
  .caption a { color: #d4d7dc; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap;
  }
</style>

<script type="module">
import { KEYS, keyFor, dtmf as dtmfTones, sections, cardPath as pathIn, SECRETS, SPEED_DIAL, LONG_PRESS_MS,
  SUPPORT, telHref, pronounce as respell } from './phone.js?v=6b81b948';

const content = document.getElementById('content');
const cardTitle = document.getElementById('cardtitle');
const skLeft = document.getElementById('sk-left');
const skRight = document.getElementById('sk-right');

let deck = null;          // parsed <wml> element
let deckDate = null;      // the deck's Last-Modified: the "firmware" date
let cards = Object.create(null);   // id -> card element
let current = null;
let rightAction = null;   // {type:'go',href} | {type:'url',href}

fetch('/index.wml?v=5e06d558')
  .then(r => {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const modified = r.headers.get('last-modified');
    if (modified) deckDate = new Date(modified);
    return r.text();
  })
  .then(xml => {
    const doc = new DOMParser().parseFromString(xml, 'text/xml');
    if (doc.querySelector('parsererror')) {
      content.textContent = 'Deck failed to parse: ' + doc.querySelector('parsererror').textContent.slice(0, 120);
      return;
    }
    deck = doc.documentElement;
    for (const c of deck.querySelectorAll('card')) cards[c.getAttribute('id')] = c;
    buildParents();
    const id = cardFromHash() || 'home';
    depth = (history.state && history.state.depth) || 0;
    history.replaceState({ depth }, '', '#' + cardPath(id));
    show(id, { push: false });
  })
  .catch(e => {
    cardTitle.textContent = 'No signal';
    content.textContent = 'The WAP deck did not load (' + e.message + '). The full site is at thiagomata.com.';
  });

// Back is the browser's own history: each card visited is an entry, and
// depth counts how many of them lead back into the phone.
let depth = 0;
function show(id, { push = true } = {}) {
  const card = cards[id];
  if (!card) return;
  current = id;
  const hash = '#' + cardPath(id);
  if (push && location.hash !== hash) history.pushState({ depth: ++depth }, '', hash);
  cardTitle.textContent = card.getAttribute('title') || id;
  const hadFocus = content.contains(document.activeElement);
  content.innerHTML = '';
  renderParagraphs(card, content);
  // keyboard users stay on the card they opened
  if (hadFocus) (content.querySelector('a') || skRight).focus();
  fitFont();
  content.scrollTop = 0;

  // Left soft key: template <do type="prev">
  skLeft.classList.toggle('dim', depth === 0);

  // Right soft key: this card's <do type="accept">
  const accept = card.querySelector('do[type=accept] go');
  if (accept) {
    skRight.textContent = (card.querySelector('do[type=accept]').getAttribute('label') || 'OK') + ' >';
    const href = accept.getAttribute('href');
    rightAction = { type: href.startsWith('#') ? 'go' : 'url', href };
  } else {
    skRight.textContent = 'Home >';
    rightAction = { type: 'go', href: '#home' };
  }
}

// Period-correct typography: one fixed device font, never scaled -
// WAP phones had fixed bitmap fonts. Art wider than the screen is
// scrolled horizontally (the arrow keys / drag), like wide tables on
// a real WAP browser. The status bar shows << >> when a card scrolls.
// A phone's screen is bigger than the 7110's, so there the letters are too.
const DEVICE_FONT = matchMedia('(pointer: coarse)').matches ? 15 : 13;
function fitFont() {
  content.style.fontSize = DEVICE_FONT + 'px';
  updateScrollHint();
}
function updateScrollHint() {
  const hint = document.getElementById('scrollhint');
  const wide = content.scrollWidth > content.clientWidth + 1;
  hint.style.visibility = wide ? 'visible' : 'hidden';
}
content.addEventListener('scroll', updateScrollHint);
function scrollContent(dx, dy) {
  const target = callScreen && !callScreen.hidden ? callScreen : content;
  target.scrollBy({ left: dx, top: dy, behavior: 'smooth' });
}

// Render the card's <p> blocks: text nodes, <br/>, <a>, <b>/<i>/<strong>/<em>
function renderParagraphs(card, container) {
  for (const p of card.querySelectorAll('p')) {
    const div = document.createElement('div');
    if (p.getAttribute('mode') === 'nowrap') div.style.whiteSpace = 'nowrap';
    walk(p, div);
    container.appendChild(div);
  }
}
function walk(node, into) {
  for (const child of node.childNodes) {
    // text; in WML $ starts a variable, and $$ is a plain $
    if (child.nodeType === 3) { into.appendChild(document.createTextNode(child.nodeValue.replaceAll('$$', '$'))); }
    else if (child.nodeType === 1) {
      const tag = child.tagName;
      if (tag === 'br') { into.appendChild(document.createElement('br')); }
      else if (tag === 'a') {
        const a = document.createElement('a');
        walk(child, a);
        const href = child.getAttribute('href') || '';
        a.href = href;
        if (href.startsWith('#')) a.onclick = e => { e.preventDefault(); show(href.slice(1)); };
        else { a.target = '_blank'; a.rel = 'noopener'; }
        into.appendChild(a);
      }
      else if (tag === 'b' || tag === 'strong') {
        const b = document.createElement('b'); walk(child, b); into.appendChild(b);
      }
      else if (tag === 'i' || tag === 'em') {
        const i = document.createElement('i'); walk(child, i); into.appendChild(i);
      }
      else { walk(child, into); }
    }
  }
}

skLeft.onclick = () => {
  if (onCall()) return hangUp();
  if (dialed) return dial(null);
  if (depth > 0) history.back();
};
skRight.onclick = () => {
  if (!rightAction) return;
  if (rightAction.type === 'go') show(rightAction.href.slice(1));
  else window.open(rightAction.href, '_blank');
};
function goHome() { show('home'); }

// Navi roller: the wheel scrolls the card; clicking its top or bottom
// half steps up or down. The ridges turn with the content.
const roller = document.getElementById('roller');
let roll = 0;
function rollBy(dy) {
  scrollContent(0, dy);
  roll += dy > 0 ? -3 : 3;
  roller.style.setProperty('--roll', roll + 'px');
}
roller.addEventListener('wheel', e => {
  e.preventDefault();
  if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) scrollContent(e.deltaX > 0 ? 60 : -60, 0);
  else rollBy(e.deltaY > 0 ? 60 : -60);
}, { passive: false });
roller.addEventListener('click', e => {
  const r = roller.getBoundingClientRect();
  rollBy(e.clientY - r.top < r.height / 2 ? -90 : 90);
});

// Keypad: digits, * and # dial a number (green calls it, red clears it).
const keypad = document.getElementById('keypad');
for (const [k, sub] of KEYS) {
  const b = document.createElement('button');
  b.className = 'key num';
  b.innerHTML = k + '<small>' + (sub || '&#160;') + '</small>';
  // The tone sounds while the key is held; held long, it speed-dials.
  // A mouse dials as the key goes down. A finger dials as it lifts, so
  // a scroll that starts on a key (the browser cancels the touch) dials
  // nothing.
  let held = null, touched = false;
  const release = () => { clearTimeout(held); held = null; toneUp(); };
  b.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    toneDown(k);
    touched = e.pointerType !== 'mouse';
    if (!touched) pressKey(k);
    held = setTimeout(() => {
      held = null; touched = false; toneUp();
      speedDial(k);
    }, LONG_PRESS_MS);
  });
  b.addEventListener('pointerup', () => {

  setTimeout(() => lcd.classList.remove('flash'), 150);
  setPower('full');
  screenText('GOD MODE\n\n', true);
  for (const [f, i] of [[523, 0], [659, 1], [784, 2], [1047, 3]]) c.tone([f], 120, i * 130, 0.05);
  await say(c, 'Full signal. Full battery. Backlight always on.', { cps: 24 });
  await c.wait(1500);
  c.end();
}
function godMode() { return startCall(godModeCall); }

// Backlight: on for a while after the last key press, like the 7110.
// It never goes off before the first one, so a visitor who only reads
// never sees a dim screen.
const lcd = document.querySelector('.screen');
let backlightTimer = null, pressed = false;
function wake(e) {
  if (e) pressed = true;
  lcd.classList.remove('unlit');
  clearTimeout(backlightTimer);
  if (pressed && POWER[power].backlightMs < Infinity) {
    backlightTimer = setTimeout(() => lcd.classList.add('unlit'), POWER[power].backlightMs);
  }
}
for (const ev of ['pointerdown', 'keydown', 'wheel', 'touchstart']) {
  document.addEventListener(ev, wake, { passive: true });
}
setPower('low');

// Deep links: the URL hash mirrors the current card as section/card,
// e.g. #experience/rokt/identity. A card's section is the first non-home card
// whose <a> links to it; cards linked only from home are top level.
// A bare #sli works too.
let parents = {};                  // card id -> section card id
function buildParents() {
  const links = {};
  for (const [id, card] of Object.entries(cards)) {
    links[id] = [...card.querySelectorAll('a')].map(a => a.getAttribute('href') || '');
  }
  parents = sections(links);
}
function cardPath(id) { return pathIn(id, parents); }
// The card a hash names, if the deck has it (never an Object built-in
// like #constructor); anything else is home.
function cardFromHash() {
  let id;
  try { id = decodeURIComponent(location.hash.slice(1)).split('/').pop(); } catch { return null; }
  return Object.hasOwn(cards, id) ? id : null;
}
window.addEventListener('popstate', e => {
  depth = (e.state && e.state.depth) || 0;
  const id = cardFromHash() || 'home';
  if (location.hash !== '#' + cardPath(id)) history.replaceState({ depth }, '', '#' + cardPath(id));
  show(id, { push: false });
});

// clock, why not
function tick() {
  const now = new Date();
  document.getElementById('clock').textContent =
    String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
}
tick();
setInterval(tick, 10000);
</script>
</body>
