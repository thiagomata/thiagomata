<svg xmlns="http://www.w3.org/2000/svg" viewBox="315 330 667 44" fill="none">
<!-- One black panel behind the car at wheel-arch height. The body is drawn on
     top of it, so it only shows through the arch openings: it fills the gap that
     opens between the car and each wheel when the body rides up, and the sliver
     around the tyres at rest. Kept inside the car's silhouette (x 315-982) and
     above the rim faces (y 374) so it never shows against the sky or the wheels. -->
<rect x="315" y="330" width="667" height="44" fill="black" />
</svg>
