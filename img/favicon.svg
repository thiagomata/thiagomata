<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72">
    <!-- The site's icon: a person with swept-back black hair, strong eyebrows and a full beard.
         favicon.ico and apple-touch-icon.png are rendered from it by tools/icons.js. -->
    <defs>
        <radialGradient id="skin" cx="0.4" cy="0.35" r="0.8">
            <stop offset="0" stop-color="rgb(244, 214, 166)"/>
            <stop offset="0.5" stop-color="rgb(235, 187, 116)"/>
            <stop offset="1" stop-color="rgb(222, 152, 52)"/>
        </radialGradient>
        <linearGradient id="jacket" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="rgb(58, 112, 180)"/>
            <stop offset="0.6" stop-color="rgb(47, 92, 150)"/>
            <stop offset="1" stop-color="rgb(64, 102, 152)"/>
        </linearGradient>
        <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="rgb(46, 42, 44)"/>
            <stop offset="1" stop-color="rgb(16, 14, 16)"/>
        </linearGradient>
        <filter id="blur" x="-20%" y="-200%" width="140%" height="500%">
            <feGaussianBlur stdDeviation="1.5"/>
        </filter>
    </defs>
    <ellipse cx="37" cy="65.5" rx="29" ry="3" fill="rgb(0, 0, 0)" opacity="0.3" filter="url(#blur)"/>
    <!-- The jacket, with a lighter rim just inside its edge. -->
    <path d="M20 33 Q37 27 54 33 C60 37 65 43 65 49 L65 57 C65 63 58 67 37 67 C16 67 9 63 9 57 L9 49 C9 43 14 37 20 33 Z"
          fill="url(#jacket)" stroke="rgb(40, 78, 130)" stroke-width="1"/>
    <path d="M21 35.5 Q37 30 53 35.5 C58 39 62.5 44 62.5 49.5 L62.5 56.5 C62.5 61.5 56 64.5 37 64.5 C18 64.5 11.5 61.5 11.5 56.5 L11.5 49.5 C11.5 44 16 39 21 35.5 Z"
          fill="none" stroke="rgb(140, 170, 210)" stroke-opacity="0.45" stroke-width="1.6"/>
    <!-- Shirt and collar. -->
    <path d="M32 41 L42 41 L37 58 Z" fill="rgb(238, 238, 238)"/>
    <path d="M29.5 37.5 L33 41.5 L35 47 Z M44.5 37.5 L41 41.5 L39 47 Z" fill="rgb(112, 148, 196)"/>
    <!-- Ears, then the face: longer than wide, narrowing to the chin. -->
    <ellipse cx="24.2" cy="21" rx="2.4" ry="3.8" fill="rgb(226, 160, 72)"/>
    <ellipse cx="49.8" cy="21" rx="2.4" ry="3.8" fill="rgb(226, 160, 72)"/>
    <path d="M25 13 C25 7 30 4 37 4 C44 4 49 7 49 13 L49 26 C49 34 44 40 37 40 C30 40 25 34 25 26 Z" fill="url(#skin)"/>
    <!-- Hair: swept up and back from the forehead, with the sideburns coming down past the ears. -->
    <path d="M24 24 C22.5 17 22.5 10 26 6 C29.5 1.5 36 0 42 0.8 C48 1.6 51.5 4.5 52 8.5 C52.4 12 51.2 17 50 24
             L48.6 24 C48.6 19 48.4 15 47.6 12.8 C44 13.6 39 13.2 35.5 12.2 C32 11.3 28.6 11.6 26.4 13.2 C25.6 16 25.4 19.5 25.4 24 Z"
          fill="url(#hair)"/>
    <path d="M30 5.6 C34 3.4 39.5 3.2 44 4.6 M33 8.4 C37 7 42 7.2 46.5 8.6" fill="none" stroke="rgb(96, 90, 94)" stroke-width="0.7" stroke-linecap="round"/>
    <!-- Strong eyebrows and eyes. -->
    <path d="M28 17.4 L34 17.8 M40 17.8 L46 17.4" fill="none" stroke="rgb(20, 18, 20)" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="31.2" cy="21.2" r="1.3" fill="rgb(30, 24, 22)"/>
    <circle cx="42.8" cy="21.2" r="1.3" fill="rgb(30, 24, 22)"/>
    <!-- Beard: up the jaw into the sideburns, full under the chin, with the mouth left open. -->
    <path d="M25.4 23 C25.4 26.5 26.5 29 28.5 30.5 C30.5 31.8 32.5 30.4 37 30.4 C41.5 30.4 43.5 31.8 45.5 30.5 C47.5 29 48.6 26.5 48.6 23
             L50 23 C50.5 28 50 34 47.5 38.5 C45 43 41.5 45.5 37 45.5 C32.5 45.5 29 43 26.5 38.5 C24 34 23.5 28 24 23 Z"
          fill="url(#hair)"/>
    <!-- Moustache, curling up at the ends, over the mouth. -->
    <path d="M33.5 34.6 Q37 35.8 40.5 34.6 Q37 37.6 33.5 34.6 Z" fill="rgb(196, 112, 82)"/>
    <path d="M37 30.6 C34.5 29.6 31.5 30 29.8 31.8 C28.8 32.8 27.6 32.8 27 31.8 C27.4 34 29.6 35 31.6 34.4 C33.6 33.8 35.2 33.2 37 33.6
             C38.8 33.2 40.4 33.8 42.4 34.4 C44.4 35 46.6 34 47 31.8 C46.4 32.8 45.2 32.8 44.2 31.8 C42.5 30 39.5 29.6 37 30.6 Z"
          fill="rgb(16, 14, 16)"/>
</svg>
